name: Docs CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate OpenAPI artifacts
        run: npm run openapi:generate

      - name: Assert generated artifacts are committed
        run: npm run openapi:assert-clean

      - name: Validate Mintlify build
        run: npm run docs:validate

      - name: Check broken links
        run: npm run docs:broken-links
